[project]
name = "researchos-data-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyarrow>=14.0",
]

[project.scripts]
researchos-data-mcp = "researchos_data_mcp.server:main"
researchos-data-bridge = "researchos_data_mcp.bridge:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_data_mcp"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
