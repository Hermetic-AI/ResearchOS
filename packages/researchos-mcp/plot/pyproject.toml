[project]
name = "researchos-plot-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0,<2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "seaborn>=0.13",
]

[project.scripts]
researchos-plot-mcp = "researchos_plot_mcp.server:main"
researchos-plot-bridge = "researchos_plot_mcp.bridge:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchos_plot_mcp"]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
