<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchOS · 翻译</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/shell.js"></script>
</head>
<body class="h-screen flex bg-paper text-ink overflow-hidden">
<aside id="shell"></aside>
<main class="flex-1 flex flex-col min-w-0">
  <header class="h-16 shrink-0 bg-card border-b hairline flex items-center px-6"><div class="font-serif text-[16px]">学术翻译</div></header>
  <div id="body" class="flex-1 overflow-y-auto"></div>
</main>
<script>
Shell.render("translate")
Shell.comingSoon(document.getElementById("body"), "学术翻译 · 对照译文",
  "段落级中英对照翻译，保留术语一致性、公式与引用锚点，译文与术语表随文献入库。当前可先在对话页选择翻译类技能进行试译。",
  ["翻译工作流：分段 → 术语表约束 → 对照排版 → 回读校对",
   "与文献库联动：@paper 引用整段翻译并落边注",
   "术语一致性检查复用 cite-assist / academic-polish 技能"])
</script>
</body>
</html>
