<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchOS · 文献星图</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/base.css">
<script src="/assets/shell.js"></script>
</head>
<body class="h-screen flex bg-paper text-ink overflow-hidden">

<aside id="shell"></aside>

<main class="flex-1 flex flex-col min-w-0">
  <header class="h-16 shrink-0 bg-card border-b hairline flex items-center px-6 gap-4">
    <div class="font-serif text-[16px]">文献星图 <span class="text-ink-faint text-[12px] font-sans ml-2" id="subtitle">项目 · 加载…</span></div>
    <div class="flex-1 max-w-lg relative ml-auto">
      <form id="searchForm" class="contents">
        <input id="searchInput" class="w-full h-9 rounded-md border hairline bg-paper pl-9 pr-3 text-[13px] outline-none focus:border-accent focus:bg-card" placeholder="检索文献库：标题 / 摘要关键词…">
      </form>
      <svg class="w-4 h-4 absolute left-3 top-2.5 text-ink-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </div>
    <div class="flex items-center gap-2 shrink-0 text-[12.5px]">
      <a href="/library.html" class="h-9 px-3 rounded-md border hairline hover:bg-paper flex items-center">文献库</a>
      <a href="/chat.html" class="h-9 px-3 rounded-md bg-accent text-white hover:opacity-90 flex items-center">开始对话 →</a>
    </div>
  </header>

  <div class="flex-1 flex min-h-0">
    <section class="flex-1 relative min-w-0">
      <svg id="map" viewBox="0 0 900 620" class="absolute inset-0 w-full h-full"></svg>

      <!-- 图例 -->
      <div class="absolute top-4 left-5 bg-card/90 border hairline rounded-md px-3.5 py-2.5 text-[11.5px] space-y-1.5 backdrop-blur">
        <div class="text-ink-faint smallcaps font-semibold mb-1">来源 · 色相</div>
        <div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-full inline-block" style="background:#2F4B7C"></i>arXiv</div>
        <div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-full inline-block" style="background:#5A6E4A"></i>Crossref / S2</div>
        <div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-full inline-block" style="background:#A67C2E"></i>手动 / 其他</div>
        <div class="flex items-center gap-2"><i class="w-2.5 h-2.5 rounded-full inline-block border-2" style="border-color:#2F4B7C"></i>光晕 = 未精读</div>
      </div>

      <!-- 空态 -->
      <div id="starmapEmpty" class="absolute inset-0 grid place-items-center">
        <div class="text-center max-w-[420px] px-8">
          <div class="font-serif text-[16px]">文献星图 · 引文宇宙</div>
          <p class="mt-3 text-[12.5px] text-ink-soft leading-relaxed">尚无文献。节点大小 ∝ 被引次数，色相 ∝ 来源，虚线 ∝ 库内引用边，光晕 = 未精读。</p>
          <a href="/library.html" class="inline-block mt-5 h-9 px-4 rounded-md bg-accent text-white text-[13px] leading-9 hover:opacity-90">去文献库收录第一篇 →</a>
        </div>
      </div>

      <div class="absolute bottom-3 left-5 right-5 text-[11px] text-ink-faint font-serif italic pointer-events-none">Fig. 1 — 文献星图：由 /api/graph 实时渲染（papers + citation_edges）。</div>
    </section>


    <aside class="w-[320px] shrink-0 bg-card border-l hairline flex flex-col">
      <div class="h-12 px-4 border-b hairline flex items-center justify-between">
        <span class="font-serif text-[14px]">假设画布</span>
        <a href="/hypotheses.html" class="text-[12px] text-accent hover:underline">管理 →</a>
      </div>
      <div id="hyps" class="flex-1 overflow-y-auto p-4 space-y-3 text-[12.5px]"></div>
      <div class="p-4 border-t hairline text-[11px] text-ink-faint leading-relaxed font-serif italic">每个假设是可证伪命题：绑定证据与反例。点「管理」新增、改状态、记证据。</div>
    </aside>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id)
const STATUS = { open: ["待定", "bg-paper text-ink-faint"], supported: ["支持", "bg-moss/10 text-moss"], refuted: ["反驳", "bg-seal/10 text-seal"], archived: ["归档", "bg-paper text-ink-faint"] }
const SOURCE_COLOR = { arxiv: "#2F4B7C", crossref: "#5A6E4A", semantic_scholar: "#5A6E4A", pubmed: "#5A6E4A", manual: "#A67C2E", zotero: "#A67C2E" }

$("searchForm").addEventListener("submit", (e) => {
  e.preventDefault()
  const q = $("searchInput").value.trim()
  location.href = q ? `/library.html?q=${encodeURIComponent(q)}` : "/library.html"
})

$("map").addEventListener("click", (e) => {
  const node = e.target.closest(".node")
  if (node) location.href = `/reading.html?paper=${node.dataset.paper}`
})

async function load() {
  const health = await fetch("/api/health").then(r => r.json()).catch(() => null)
  if (health) $("subtitle").textContent = `项目 · ${health.directory}`
  Shell.render("starmap", { library: "—" })
  renderHypotheses()
  renderStarmap()
}

async function renderStarmap() {
  const graph = await fetch("/api/graph").then(r => r.json()).catch(() => ({ nodes: [], edges: [] }))
  const nav = document.querySelector('#shell a[href="/library.html"] .ml-auto')
  if (nav) nav.textContent = String(graph.nodes.length)
  if (graph.nodes.length === 0) return
  $("starmapEmpty").classList.add("hidden")
  drawGraph(graph)
}

function drawGraph({ nodes, edges }) {
  const W = 900, H = 620, cx = W / 2, cy = H / 2 + 10
  const maxCit = Math.max(1, ...nodes.map(n => n.citation_count))
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]))
  const R = (n) => 12 + 26 * Math.sqrt(Math.log1p(n.citation_count) / Math.log1p(maxCit))
  const angle = (i) => (i / nodes.length) * Math.PI * 2 - Math.PI / 2
  const pos = nodes.map((n, i) => {
    const spread = 150 + (nodes.length > 6 ? (i % 3) * 70 : 60)
    const a = angle(i)
    return { n, x: cx + Math.cos(a) * spread * 1.35, y: cy + Math.sin(a) * spread }
  })
  const edgeSvg = edges
    .filter(e => byId[e.from_id] && byId[e.to_id])
    .map(e => {
      const s = pos.find(p => p.n.id === e.from_id), t = pos.find(p => p.n.id === e.to_id)
      return `<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="#C9C4B4" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>`
    }).join("")
  const nodeSvg = pos.map(({ n, x, y }) => {
    const r = R(n)
    const color = SOURCE_COLOR[n.source] ?? "#A67C2E"
    const glow = n.is_read ? "" : `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="${color}" stroke-width="1.4" opacity="0.45"/>`
    const label = n.title.length > 22 ? n.title.slice(0, 21) + "…" : n.title
    return `<g class="node" data-paper="${n.id}" style="cursor:pointer"><title>${Shell.esc(n.title)} · 被引 ${n.citation_count} · 点击进入阅读</title>
      ${glow}
      <circle cx="${x}" cy="${y}" r="${r}" fill="${color}" opacity="0.92"/>
      <text x="${x}" y="${y + r + 13}" font-size="10" fill="#6B6A61" text-anchor="middle">${Shell.esc(label)}</text>
    </g>`
  }).join("")
  $("map").innerHTML = `<g>${edgeSvg}</g><g>${nodeSvg}</g>`
}

async function renderHypotheses() {
  const hyps = await fetch("/api/hypotheses").then(r => r.json())
  const box = $("hyps")
  box.innerHTML = ""
  if (hyps.length === 0) {
    box.innerHTML = `<a href="/hypotheses.html" class="block border border-dashed hairline rounded-lg p-4 text-center text-ink-faint hover:border-accent hover:text-accent">＋ 还没有假设，去假设画布提出第一个</a>`
    return
  }
  for (const h of hyps) {
    const [label, cls] = STATUS[h.status] ?? STATUS.open
    const accent = h.status === "supported" ? "border-l-moss" : h.status === "refuted" ? "border-l-seal" : "border-l-accent"
    const d = document.createElement("a")
    d.href = "/hypotheses.html"
    d.className = `block border hairline ${accent} border-l-2 rounded-lg p-3.5 hover:bg-paper`
    d.innerHTML = `
      <div class="flex items-center gap-2"><span class="font-serif font-semibold truncate">${Shell.esc(h.statement)}</span><span class="ml-auto text-[10.5px] px-1.5 py-0.5 rounded ${cls}">${label}</span></div>
      <div class="flex gap-3 mt-2.5 text-[11px] text-ink-faint"><span>证据 <b class="text-moss">${h.support_count ?? 0}</b></span><span>反例 <b class="text-seal">${h.refute_count ?? 0}</b></span></div>`
    box.appendChild(d)
  }
}
load()
</script>
</body>
</html>
